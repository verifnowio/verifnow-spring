name: Security and Dependencies

on:
  schedule:
    # Run every Monday at 8 AM UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: { }
  # Deliberately off the push and pull request paths. OWASP dependency-check downloads the NVD
  # database, which takes hours without an API key and stalls every review behind a scan whose
  # result rarely changes between two commits. The same mistake cost days of CI time in validAPI
  # before the scan was moved to a schedule there. Run it on demand when a dependency changes.

jobs:
  security-scan:
    runs-on: ubuntu-latest
    # Without an NVD API key the feed is rate limited to a crawl: the 14 September run spent 45 of
    # its 48 minutes downloading CVE definitions. The cap keeps a bad day from burning an hour.
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      contents: read
      # Publishing SARIF to the Security tab is a write, and the default token is read-only.
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Say what is missing
      if: env.NVD_API_KEY == ''
      run: |
        echo "::warning title=No NVD API key::The scan is skipped. Request a free key at" \
             "https://nvd.nist.gov/developers/request-an-api-key and add it as the NVD_API_KEY" \
             "secret. Without it the NVD feed is rate limited to roughly 45 minutes of downloads" \
             "per run, which is why this job used to run for the best part of an hour."

    # The CVE database, kept apart from the dependency cache so a pom change does not discard it.
    # restore-keys means last week's copy is reused and only the delta is fetched.
    - name: Cache the NVD database
      if: env.NVD_API_KEY != ''
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: nvd-${{ github.run_id }}
        restore-keys: nvd-

    - name: Run OWASP Dependency Check
      # Skipped without a key rather than left to crawl. A weekly scan that takes 45 minutes to
      # read a feed everyone else reads in seconds is not a scan worth waiting for.
      if: env.NVD_API_KEY != ''
      run: |
        # The modules must be in the local repository first: invoking the plugin goal directly
        # does not build the reactor, so verifnow-spring cannot resolve verifnow-core at a version
        # that is not published yet — every scan between a version bump and its release failed.
        mvn -B -ntp -DskipTests install
        # nvdApiKeyEnvironmentVariable is the plugin's recommended way to pass the key in CI: it
        # never reaches the command line, where it would show up in process listings.
        # nvdValidForHours 168 keeps the restored cache from being re-downloaded every Monday.
        mvn -B -ntp org.owasp:dependency-check-maven:check \
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
          -DnvdValidForHours=168

    - name: Upload dependency check results
      uses: actions/upload-artifact@v4
      if: always() && hashFiles('target/dependency-check-report.html') != ''
      with:
        name: dependency-check-report
        path: target/dependency-check-report.html

    - name: Run Snyk to check for vulnerabilities
      # Skipped without a token: the action pulls a container image and fails on authentication,
      # which is noise rather than a security finding.
      if: env.SNYK_TOKEN != ''
      uses: snyk/actions/maven@master
      continue-on-error: true
      with:
        args: --severity-threshold=high

    - name: Upload Snyk results
      # Only when Snyk actually produced a report. It is skipped whenever SNYK_TOKEN is unset, and
      # the upload then failed the whole job looking for a file that was never written.
      # v3: v1 and v2 of the CodeQL action are deprecated and log an error of their own.
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('snyk.sarif') != ''
      with:
        sarif_file: snyk.sarif

  dependency-update:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    # The default token is read-only, so pushing the branch was denied with a 403 and no PR was
    # ever opened. The repository must also allow Actions to create pull requests
    # (Settings > Actions > General), which no workflow file can grant.
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Update dependencies
      run: |
        mvn versions:update-properties
        mvn versions:use-latest-releases

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'Automated dependency updates'
        body: |
          This PR contains automated dependency updates.
          
          Please review the changes and ensure all tests pass before merging.
        branch: dependency-updates
        delete-branch: true
