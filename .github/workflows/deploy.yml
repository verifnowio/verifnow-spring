name: Deploy to Maven Central

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      auto_bump_next_snapshot:
        description: 'After release, bump to next patch -SNAPSHOT automatically'
        required: false
        default: true
        type: boolean
      deploy_snapshot:
        description: 'Deploy current SNAPSHOT (or provided snapshot_version) to snapshots repo'
        required: false
        default: false
        type: boolean
      snapshot_version:
        description: 'Optional SNAPSHOT version to set before deploying (must end with -SNAPSHOT)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21 and Maven server credentials
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: central
        server-username: MAVEN_USERNAME
        server-password: MAVEN_PASSWORD
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Configure Git user
      run: |
        git config user.email "action@github.com"
        git config user.name "GitHub Action"

    - name: Set Maven Central Publishing credentials env
      run: |
        echo "MAVEN_USERNAME=${{ secrets.CENTRAL_USERNAME }}" >> $GITHUB_ENV
        echo "MAVEN_PASSWORD=${{ secrets.CENTRAL_PASSWORD }}" >> $GITHUB_ENV
        echo "GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}" >> $GITHUB_ENV

    # Manual Release Flow
    - name: Read project version from parent POM
      id: get_version
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        VERSION=$(mvn -q -N -DforceStdout help:evaluate -Dexpression=project.version)
        echo "project_version=$VERSION" >> $GITHUB_OUTPUT
        if [[ "$VERSION" == *-SNAPSHOT ]]; then
          RELEASE_VERSION="${VERSION%-SNAPSHOT}"
          echo "is_snapshot=true" >> $GITHUB_OUTPUT
        else
          RELEASE_VERSION="$VERSION"
          echo "is_snapshot=false" >> $GITHUB_OUTPUT
        fi
        echo "release_version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
        if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Derived release version '$RELEASE_VERSION' is not a plain x.y.z number. Adjust parent pom version." >&2
          exit 1
        fi

    - name: Ensure tag does not already exist
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        git fetch --tags --force
        if git tag -l "v${{ steps.get_version.outputs.release_version }}" | grep -q "."; then
          echo "Tag v${{ steps.get_version.outputs.release_version }} already exists" >&2
          exit 1
        fi

    - name: Set project version to release (strip -SNAPSHOT)
      if: ${{ github.event_name == 'workflow_dispatch' && steps.get_version.outputs.is_snapshot == 'true' }}
      run: |
        mvn -B -ntp -q versions:set -DgenerateBackupPoms=false -DnewVersion=${{ steps.get_version.outputs.release_version }}

    - name: Deploy Release to Central (manual)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        mvn -B -ntp clean deploy -P release

    - name: Commit version change (if any)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        if [[ -n "$(git status --porcelain)" ]]; then
          git add -A
          git commit -m "chore(release): ${{ steps.get_version.outputs.release_version }}"
          git push origin HEAD:main
        fi

    - name: Tag and push release tag
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        git tag -a v${{ steps.get_version.outputs.release_version }} -m "Release ${{ steps.get_version.outputs.release_version }}"
        git push origin v${{ steps.get_version.outputs.release_version }}

    - name: Generate changelog (manual)
      id: changelog_manual
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      run: |
        git fetch --tags --force
        NEW_TAG="v${{ steps.get_version.outputs.release_version }}"
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$NEW_TAG$" | head -n1)
        if [[ -n "$PREV_TAG" ]]; then
          RANGE="$PREV_TAG..$NEW_TAG"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/$PREV_TAG...$NEW_TAG"
        else
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n1)
          RANGE="$FIRST_COMMIT..$NEW_TAG"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$NEW_TAG"
        fi
        BODY=$(printf "## Changes\n\n")
        LOG=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | sed '/chore(release)/d')
        if [[ -z "$LOG" ]]; then LOG="- No notable changes"; fi
        BODY+="$LOG\n\n[View comparison]($COMPARE_URL)"
        {
          echo 'body<<EOF'
          echo "$BODY"
          echo 'EOF'
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release (manual)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.get_version.outputs.release_version }}
        name: v${{ steps.get_version.outputs.release_version }}
        body: ${{ steps.changelog_manual.outputs.body }}
        files: |
          verifnow-core/target/*.jar
          verifnow-spring/target/*.jar
          verifnow-spring-boot-starter/target/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute next patch SNAPSHOT
      id: next_snap
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' && github.event.inputs.auto_bump_next_snapshot == 'true' }}
      run: |
        v='${{ steps.get_version.outputs.release_version }}'
        IFS='.' read -r MAJ MIN PAT <<< "$v"
        NEXT_PATCH=$((PAT+1))
        NEXT_VERSION="$MAJ.$MIN.$NEXT_PATCH-SNAPSHOT"
        echo "next_snapshot=$NEXT_VERSION" >> $GITHUB_OUTPUT

    - name: Bump to next SNAPSHOT (auto)
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_snapshot != 'true' && github.event.inputs.auto_bump_next_snapshot == 'true' }}
      run: |
        mvn -B -ntp -q versions:set -DgenerateBackupPoms=false -DnewVersion=${{ steps.next_snap.outputs.next_snapshot }}
        git add -A
        git commit -m "chore: start next development iteration ${{ steps.next_snap.outputs.next_snapshot }}"
        git push origin HEAD:main

    # Snapshot deployment (manual)
    - name: Set version for SNAPSHOT (optional)
      if: ${{ github.event.inputs.deploy_snapshot == 'true' && github.event.inputs.snapshot_version != '' }}
      run: |
        if [[ ! "${{ github.event.inputs.snapshot_version }}" =~ -SNAPSHOT$ ]]; then
          echo "snapshot_version must end with -SNAPSHOT" >&2
          exit 1
        fi
        mvn -B -ntp -q versions:set -DgenerateBackupPoms=false -DnewVersion=${{ github.event.inputs.snapshot_version }}

    - name: Validate current version is SNAPSHOT
      if: ${{ github.event.inputs.deploy_snapshot == 'true' }}
      run: |
        CURR=$(mvn -q -N -DforceStdout help:evaluate -Dexpression=project.version)
        echo "Current project version: $CURR"
        if [[ "$CURR" != *-SNAPSHOT ]]; then
          echo "Current version '$CURR' is not a SNAPSHOT. Provide snapshot_version input or update pom to a -SNAPSHOT." >&2
          exit 1
        fi

    - name: Deploy SNAPSHOT to Central
      if: ${{ github.event.inputs.deploy_snapshot == 'true' }}
      run: |
        mvn -B -ntp clean deploy -P release

    # Tag-triggered release flow
    - name: Deploy Release to Central (tag)
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mvn -B -ntp versions:set -DnewVersion=${GITHUB_REF#refs/tags/v}
        mvn -B -ntp clean deploy -P release

    - name: Generate changelog (tag)
      id: changelog_tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        git fetch --tags --force
        CURRENT_TAG=${GITHUB_REF#"refs/tags/"}
        PREV_TAG=$(git tag --sort=-creatordate | grep -v "^$CURRENT_TAG$" | head -n1)
        if [[ -n "$PREV_TAG" ]]; then
          RANGE="$PREV_TAG..$CURRENT_TAG"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/$PREV_TAG...$CURRENT_TAG"
        else
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD | tail -n1)
          RANGE="$FIRST_COMMIT..$CURRENT_TAG"
          COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/$CURRENT_TAG"
        fi
        BODY=$(printf "## Changes\n\n")
        LOG=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | sed '/chore(release)/d')
        if [[ -z "$LOG" ]]; then LOG="- No notable changes"; fi
        BODY+="$LOG\n\n[View comparison]($COMPARE_URL)"
        {
          echo 'body<<EOF'
          echo "$BODY"
          echo 'EOF'
        } >> $GITHUB_OUTPUT

    - name: Create GitHub Release (tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        body: ${{ steps.changelog_tag.outputs.body }}
        files: |
          verifnow-core/target/*.jar
          verifnow-spring/target/*.jar
          verifnow-spring-boot-starter/target/*.jar
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
