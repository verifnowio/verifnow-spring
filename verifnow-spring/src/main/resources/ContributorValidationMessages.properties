# Default validation messages for VerifNow annotations.
#
# Hibernate Validator automatically loads this file from libraries,
# so consuming applications get human-readable messages out of the box.
#
# To override, define the same keys in your application's
# ValidationMessages.properties (or a locale-specific variant).

# ── Email ────────────────────────────────────────────────────────────
validation.verifnow.email.invalid=Invalid email address
validation.verifnow.email.risk_score.exceeded=Email rejected: risk score {riskScore} exceeds the maximum allowed ({maxRiskScore})
validation.verifnow.email.risk_level.exceeded=Email rejected: risk level {riskLevel} exceeds the maximum allowed ({maxRiskLevel})
validation.verifnow.email.deliverability.rejected=Email rejected: deliverability {deliverability} is not in the allowed list ({allowedDeliverabilities})

# ── Phone ────────────────────────────────────────────────────────────
validation.verifnow.phone.invalid=Invalid phone number

# ── IBAN ─────────────────────────────────────────────────────────────
validation.verifnow.iban.invalid=Invalid IBAN

# ── NAS ──────────────────────────────────────────────────────────────
validation.verifnow.nas.invalid=Invalid NAS

# ── NIF ──────────────────────────────────────────────────────────────
validation.verifnow.nif.invalid=Invalid NIF

# ── SSN ──────────────────────────────────────────────────────────────
validation.verifnow.ssn.invalid=Invalid SSN

# ── VAT ──────────────────────────────────────────────────────────────
validation.verifnow.vat.invalid=Invalid VAT number

